server {
    listen 80;
    listen [::]:80;
    server_name unison.micutu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://unison.micutu.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name unison.micutu.com;

    ssl_certificate /etc/letsencrypt/live/unison.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unison.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($from_cloudflare_origin = 0) { return 403; }

    root /var/www/unison.micutu.com/current;
    index index.html;
    include snippets/block-dotfiles.conf;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn unison_conn 12;

    access_log /var/log/nginx/unison.micutu.com.access.log;
    error_log /var/log/nginx/unison.micutu.com.error.log warn;

    include snippets/unison-headers.conf;
    # Keep the application guards for direct/local requests; publish one copy
    # of each security header at the proxy boundary.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location = /api/health {
        limit_except GET { deny all; }
        limit_req zone=unison_http burst=40 nodelay;

        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /api/idea {
        limit_except GET POST { deny all; }
        limit_req zone=unison_http burst=40 nodelay;
        limit_req zone=unison_write burst=10 nodelay;

        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
    }

    location = /api/preview {
        limit_except POST { deny all; }
        limit_req zone=unison_http burst=40 nodelay;
        limit_req zone=unison_preview burst=6 nodelay;
        proxy_pass http://127.0.0.1:8097;
        include snippets/unison-proxy.conf;
    }

    location ^~ /api/ {
        limit_except GET POST { deny all; }
        limit_req zone=unison_http burst=40 nodelay;
        limit_req zone=unison_write burst=10 nodelay;
        proxy_pass http://127.0.0.1:8097;
        include snippets/unison-proxy.conf;

        # Nested so the ^~ prefix does not hide it: reactions get their own zone.
        location ~ "^/api/idea/[0-9]{1,19}/water$" {
            limit_except POST { deny all; }
            limit_req zone=unison_http burst=40 nodelay;
            limit_req zone=unison_react burst=20 nodelay;
            proxy_pass http://127.0.0.1:8097;
            include snippets/unison-proxy.conf;
        }
    }

    # Server-rendered public pages and crawl files come from the API process.
    location ~ "^/i/[0-9]{1,19}$" {
        limit_except GET HEAD { deny all; }
        limit_req zone=unison_http burst=40 nodelay;
        proxy_pass http://127.0.0.1:8097;
        include snippets/unison-proxy.conf;
    }

    location = /sitemap.xml {
        limit_except GET HEAD { deny all; }
        limit_req zone=unison_http burst=20 nodelay;
        proxy_pass http://127.0.0.1:8097;
        include snippets/unison-proxy.conf;
    }

    location = /feed.xml {
        limit_except GET HEAD { deny all; }
        limit_req zone=unison_http burst=20 nodelay;
        proxy_pass http://127.0.0.1:8097;
        include snippets/unison-proxy.conf;
    }

    location = /ws {
        if ($request_method != GET) { return 405; }
        if ($unison_origin_allowed = 0) { return 403; }

        limit_req zone=unison_http burst=20 nodelay;
        limit_conn unison_conn 4;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $unison_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        # One Cache-Control header: `expires` would add a second one.
        include snippets/unison-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        limit_except GET HEAD { deny all; }
        try_files /index.html =404;
        # A fresh CSP nonce must match Cloudflare's freshly injected HTML.
        etag off;
        if_modified_since off;
        include snippets/unison-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        limit_except GET HEAD { deny all; }
        etag off;
        if_modified_since off;
        include snippets/unison-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Not in the stock MIME table; browsers expect the manifest media type.
    location = /manifest.webmanifest {
        limit_except GET HEAD { deny all; }
        default_type application/manifest+json;
        try_files $uri =404;
        expires -1;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires -1;
    }

    error_page 429 = @ratelimited;
    location @ratelimited {
        default_type text/plain;
        include snippets/unison-headers.conf;
        add_header Retry-After 30 always;
        return 429 "Too many requests. Slow down and try again.\n";
    }
}
