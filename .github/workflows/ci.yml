name: Verify application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 5 * * 1'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s backend -v
      - run: python -m unittest discover -s scripts -v
      # deploy.sh builds the production virtualenv from these exact wheels.
      - name: Verify the hash-locked runtime installs from wheels
        run: >-
          python -m pip download --disable-pip-version-check --no-deps
          --require-hashes --only-binary=:all: --dest "$RUNNER_TEMP/wheels"
          -r backend/requirements.lock
      - run: pip-audit -r backend/requirements.lock --require-hashes --disable-pip --progress-spinner=off
      - run: bash -n deploy.sh backend/run_backend.sh scripts/check_nginx.sh
      - run: shellcheck deploy.sh backend/run_backend.sh scripts/check_nginx.sh
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
